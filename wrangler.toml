name = "captivate-ai-backend-v2"
main = "captivate-ai-api.js"
compatibility_date = "2026-10-25"
workers_dev = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = false

[ai]
binding = "AI"

[[d1_databases]]
binding = "CRM_DB"
database_name = "captivate-business-os-db"
database_id = "c85e5cb0-f639-4eb2-88da-05391afecfdb"
